</head><body class="auth-shell min-h-screen text-white"><a class="skip-link" href="#main">Lewati ke konten</a><header class="auth-header border-b border-white/10"><nav class="mx-auto flex min-h-16 max-w-3xl items-center justify-between px-4" aria-label="Navigasi utama"><a class="mono-brand" href="/" aria-label="KartuNamaDigital.id, halaman utama"><span class="mono-brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><rect x="3" y="2.5" width="18" height="19" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M6.5 15c.7-2.2 4.3-2.2 5 0M14 8h4M14 12h4M14 16h3"/></svg></span><span>KARTUNAMA<br><small>DIGITAL.ID</small></span></a><a href="/login/" class="text-sm font-semibold">Masuk</a></nav></header><main id="main" class="auth-main"><h1 class="text-3xl font-black tracking-tight">Verifikasi email</h1><p class="auth-intro mt-3 ">Masukkan kode 6 digit dari email Anda.</p><form class="auth-panel mt-8 space-y-5" data-verify-form novalidate><div><label class="block text-sm font-semibold" for="email">Email</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="email" name="email" type="email" autocomplete="email" required><p class="mt-1 text-sm text-red-700" data-field-error="email"></p></div><div><label class="block text-sm font-semibold" for="code">Kode OTP</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3 text-center text-2xl font-bold tracking-widest" id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required><p class="mt-1 text-sm text-red-700" data-field-error="code"></p></div><button class="auth-primary min-h-11 w-full rounded-lg px-4 py-3 font-bold text-white" type="submit">Verifikasi</button><button class="auth-secondary min-h-11 w-full rounded-lg border px-4 py-3 font-semibold" type="button" data-resend-otp>Kirim ulang OTP</button><p class="text-sm" aria-live="polite" data-form-status></p></form></main><script type="module" src="/pages/auth/verify-
