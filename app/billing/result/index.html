<!doctype html>
<html lang="id" class="ui-foundations">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Hasil pembayaran — KartuNamaDigital.id</title>
  <script src="/assets/js/payment-return.js"></script>
  <link rel="stylesheet" href="/assets/css/tailwind.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/site-theme.js"></script>
  <link rel="stylesheet" href="/assets/css/site-theme.css">
  <link rel="stylesheet" href="/assets/css/foundations-tokens.css">
  <link rel="stylesheet" href="/assets/css/foundations-typography.css">
  <link rel="stylesheet" href="/assets/css/foundations-primitives.css">
</head>
<body class="dashboard-shell app-shell-page">
  <a class="skip-link" href="#main">Lewati ke konten</a>
  <main id="main" class="mx-auto max-w-6xl space-y-6 px-4 py-8" data-payment-result>
    <section class="dashboard-panel billing-result-panel p-6">
      <h1>Hasil pembayaran</h1>
      <p class="billing-result-status" data-form-status role="status" aria-live="polite">Memuat status pembayaran...</p>
      <p class="billing-result-hint">Status pembayaran dan paket diperiksa melalui server.</p>
      <div class="billing-result-actions">
        <button class="fdn-button--secondary" type="button" data-billing-retry hidden>Coba muat ulang</button>
        <a class="fdn-button--secondary" href="/app/billing/">Lihat seluruh riwayat pembayaran</a>
      </div>
    </section>
    <section class="dashboard-panel billing-result-panel p-6" aria-labelledby="subscription-title">
      <h2 id="subscription-title">Langganan saat ini</h2>
      <div data-subscription-summary></div>
    </section>
    <section class="space-y-4" aria-labelledby="payment-title">
      <h2 id="payment-title">Status transaksi</h2>
      <div class="grid gap-3" data-payment-history></div>
    </section>
  </main>
  <script type="module" src="/components/app-shell.js"></script>
  <script type="module" src="/pages/app/billing.js"></script>
</body>
</html>
