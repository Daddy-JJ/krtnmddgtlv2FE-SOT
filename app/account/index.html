<!doctype html>
<html lang="id" class="app-theme-dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
  <title>Account - KartuNamaDigital.id</title>
  <link rel="stylesheet" href="/assets/css/tailwind.css"><link rel="stylesheet" href="/assets/css/app.css"><script src="/assets/js/site-theme.js"></script><link rel="stylesheet" href="/assets/css/site-theme.css">
</head>
<body class="dashboard-shell app-shell-page min-h-screen text-white">
  <a class="skip-link" href="#main">Lewati ke konten</a>
  <header class="dashboard-header border-b border-white/10"><nav class="mx-auto flex min-h-16 max-w-4xl items-center justify-between px-4" aria-label="Navigasi aplikasi"><a class="mono-brand" href="/app/" aria-label="KartuNamaDigital.id, dashboard"><span class="mono-brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><rect x="3" y="2.5" width="18" height="19" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M6.5 15c.7-2.2 4.3-2.2 5 0M14 8h4M14 12h4M14 16h3"/></svg></span><span>KARTUNAMA<br><small>DIGITAL.ID</small></span></a><button class="min-h-11 rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold" type="button" data-account-logout>Keluar</button></nav></header>
  <main id="main" class="mx-auto max-w-4xl px-4 py-8">
    <p class="text-sm font-semibold uppercase tracking-wider text-teal-700">Akun</p>
    <h1 class="mt-1 text-3xl font-black tracking-tight">Pengaturan akun</h1>
    <p class="mt-2 text-slate-600" aria-live="polite" data-form-status>Memuat keamanan akun...</p>
    <div class="mt-6 max-w-2xl">
      <section class="rounded-lg border border-slate-200 bg-white p-5">
        <h2 class="text-xl font-black">Reset password</h2>
        <p class="mt-3 text-sm text-slate-600">Kami akan mengirim link reset ke email akun Anda.</p>
        <form class="mt-5 space-y-4" data-account-reset-form novalidate>
          <div>
            <label class="block text-sm font-semibold" for="reset-email">Email akun</label>
            <input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="reset-email" name="email" type="email" autocomplete="email" readonly aria-readonly="true" required>
            <p class="mt-1 text-sm text-red-700" data-field-error="email"></p>
          </div>
          <button class="min-h-11 w-full rounded-lg bg-slate-900 px-4 py-3 font-bold text-white" type="submit" data-account-reset-submit disabled>Kirim instruksi reset</button>
        </form>
      </section>
    </div>
  </main>
  <script type="module" src="/components/app-shell.js"></script><script type="module" src="/pages/app/account.js"></script>
</body></html>
