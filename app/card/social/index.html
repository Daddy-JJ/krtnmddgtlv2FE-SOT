<!doctype html>
<html lang="id" class="app-theme-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Tautan sosial | KartuNamaDigital.id</title>
  <link rel="stylesheet" href="/assets/css/tailwind.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/site-theme.js"></script>
  <link rel="stylesheet" href="/assets/css/site-theme.css">
</head>
<body class="dashboard-shell app-shell-page min-h-screen text-white">
  <a class="skip-link" href="#main">Lewati ke konten</a>
  <main id="main" class="mx-auto grid max-w-5xl gap-6 px-4 py-8 md:grid-cols-[360px_1fr]" data-content-page="social">
    <section>
      <a class="mono-brand" href="/app/" aria-label="KartuNamaDigital.id, dashboard"><span class="mono-brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><rect x="3" y="2.5" width="18" height="19" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M6.5 15c.7-2.2 4.3-2.2 5 0M14 8h4M14 12h4M14 16h3"/></svg></span><span>KARTUNAMA<br><small>DIGITAL.ID</small></span></a>
      <h1 class="mt-8 text-3xl font-black tracking-tight">Tautan sosial</h1>
      <p class="mt-2 text-sm text-slate-400">Tambahkan profil sosial yang akan tampil pada kartu publik. Limit paket diverifikasi oleh backend.</p>
      <form class="mt-6 space-y-4 rounded-lg border border-slate-200 bg-white p-5" data-content-form novalidate>
        <div>
          <label class="block text-sm font-semibold" for="platform">Platform</label>
          <select class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="platform" name="platform"><option value="instagram">Instagram</option><option value="facebook">Facebook</option><option value="linkedin">LinkedIn</option><option value="youtube">YouTube</option><option value="tiktok">TikTok</option><option value="x">X</option><option value="other">Lainnya</option></select>
          <p class="mt-1 text-sm text-red-700" data-field-error="platform"></p>
        </div>
        <div>
          <label class="block text-sm font-semibold" for="url">Alamat profil</label>
          <input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="url" name="url" type="url" inputmode="url" autocomplete="url" placeholder="https://instagram.com/..." required>
          <p class="mt-1 text-sm text-red-700" data-field-error="url"></p>
        </div>
        <button class="min-h-11 w-full rounded-lg bg-slate-900 px-4 py-3 font-bold text-white" type="submit">Tambah tautan sosial</button>
        <p class="text-sm" aria-live="polite" data-form-status></p>
      </form>
    </section>
    <section>
      <div class="flex items-end justify-between gap-3">
        <div><h2 class="text-xl font-black">Daftar tautan</h2><p class="mt-1 text-sm text-slate-400">Urutan mengikuti posisi tersimpan. Edit dan ubah urutan belum tersedia.</p></div>
        <p class="text-sm text-slate-400" data-content-count>0 item</p>
      </div>
      <div class="mt-4 grid gap-3" data-content-list></div>
    </section>
  </main>
  <script type="module" src="/components/app-shell.js"></script>
  <script type="module" src="/pages/app/card-content.js"></script>
</body>
</html>
