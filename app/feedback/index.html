<!doctype html>
<html lang="id" class="app-theme-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>User Feedback - KartuNamaDigital.id</title>
  <link rel="stylesheet" href="/assets/css/tailwind.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/site-theme.js"></script>
  <link rel="stylesheet" href="/assets/css/site-theme.css">
  <link rel="stylesheet" href="/assets/css/foundations-tokens.css">
  <link rel="stylesheet" href="/assets/css/foundations-typography.css">
  <link rel="stylesheet" href="/assets/css/foundations-primitives.css">
  <script>document.documentElement.classList.add("ui-foundations")</script>
</head>
<body class="dashboard-shell app-shell-page min-h-screen text-white">
  <a class="skip-link" href="#main">Lewati ke konten</a>
  <main id="main" class="min-w-0">
    <section class="dashboard-panel relative overflow-hidden p-6 sm:p-8">
      <div class="hero-orb hero-orb--blue opacity-30" aria-hidden="true"></div>
      <div class="relative z-10 max-w-2xl">
        <p class="text-xs font-bold uppercase tracking-[0.18em] text-emerald-300">User feedback</p>
        <h1 class="mt-2 text-3xl font-black tracking-tight text-white sm:text-4xl">Bantu kami menjadi lebih baik</h1>
        <p class="mt-3 leading-7 text-slate-400">Apa improvement yang paling Anda perlukan dari KartuNamaDigital.id?</p>
        <form class="mt-7" data-feedback-form novalidate>
          <label class="font-semibold text-slate-100" for="feedback-message">Masukan Anda</label>
          <textarea class="app-shell__textarea mt-3 min-h-40 w-full rounded-2xl px-4 py-4" id="feedback-message" name="message" maxlength="300" required aria-describedby="feedback-help feedback-counter"></textarea>
          <div class="mt-2 flex justify-between gap-4 text-sm text-slate-400">
            <p id="feedback-help">Jangan sertakan password, token, atau informasi rahasia.</p>
            <output id="feedback-counter" data-feedback-counter for="feedback-message">0/300</output>
          </div>
          <p class="mt-2 text-sm text-rose-300" data-field-error="message"></p>
          <button class="primary-cta mt-5 min-h-12 rounded-xl px-6 font-bold text-white" type="submit">Kirim feedback</button>
          <p class="mt-4 text-sm text-slate-300" aria-live="polite" data-form-status></p>
        </form>
      </div>
    </section>
  </main>
  <script type="module" src="/components/app-shell.js"></script>
  <script type="module" src="/pages/app/feedback.js"></script>
</body>
</html>
